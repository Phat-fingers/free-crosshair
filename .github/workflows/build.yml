name: Build

on:
  push:
    branches: [main]
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: dotnet build FreeCrosshair.csproj -c Release -o out

      - name: Self-test - draw every crosshair
        shell: pwsh
        run: |
          $p = Start-Process out\FreeCrosshair.exe -ArgumentList '--render-test', "$PWD\test-output" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "render test failed ($($p.ExitCode))" }

      - name: Self-test - settings window
        shell: pwsh
        run: |
          $p = Start-Process out\FreeCrosshair.exe -ArgumentList '--settings-test', "$PWD\test-output\settings-window.png" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "settings test failed ($($p.ExitCode))" }

      - name: Self-test - overlay shows on screen
        shell: pwsh
        continue-on-error: true # CI machines don't always have a real desktop to capture
        run: |
          $p = Start-Process out\FreeCrosshair.exe -ArgumentList '--screenshot-test', "$PWD\test-output\on-screen.png" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "overlay screenshot test failed ($($p.ExitCode))" }

      - name: Print test pictures to log (base64)
        if: always() && github.event_name != 'release'
        shell: pwsh
        run: |
          foreach ($f in 'settings-window.png', 'on-screen.png', '_contact-sheet.png') {
            $p = "test-output\$f"
            if (Test-Path $p) {
              Write-Output "BEGIN-B64 $f"
              [Convert]::ToBase64String([IO.File]::ReadAllBytes($p)) -split '(.{4000})' | Where-Object { $_ } | ForEach-Object { Write-Output "B64:$_" }
              Write-Output "END-B64 $f"
            }
          }

      - name: Upload test pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: FreeCrosshair
          path: out/FreeCrosshair.exe

      - name: Attach exe to release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" out/FreeCrosshair.exe --clobber -R "${{ github.repository }}"
